# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- script: echo $JFROG_CLI_LOG_LEVEL
  displayName: 'DEBUG'



- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
    echo ${env:JFROGCLIVERSION}
  displayName: 'Run a multi-line script'




- task: JFrogDocker@1
  inputs:
    command: 'Pull'
    artifactoryConnection: 'jfart'
    imageName: 'adoption.jfrog.io/test-plk-docker-local/jfrog/router:7.135.2'
    skipLogin: false

- task: JFrogDocker@1
  inputs:
    command: 'Scan'
    xrayConnection: 'jfxray'
    imageName: 'adoption.jfrog.io/test-plk-docker-local/jfrog/router:7.135.2'
    watchesSource: 'watches'
    watches: 'test-plk-az'
    licenses: true
    allowBypassArchiveLimits: false
    threads: '3'
    skipLogin: false

- task: JfrogCliV2@1
  inputs:
    jfrogPlatformConnection: 'myjfrogplat'
    useCustomVersion: true
    cliVersion: '2.93.0'
    command: 'jf docker scan adoption.jfrog.io/test-plk-docker-local/jfrog/router:7.135.2 --watches=test-plk-az --vuln'
    
